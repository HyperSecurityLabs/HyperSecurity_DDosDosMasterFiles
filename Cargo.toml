[package]
name = "AdvancedCyberWarFare-Tools"
version = "9.20.2091"
edition = "2021"
authors = ["khaninkali <khaninkali@hypersecurity.com>"]
description = "Advanced Network Security Testing Suite - Professional penetration testing tools"
license = "Private"
repository = "https://github.com/khaninkali/Kali-Utils"
keywords = ["security", "penetration-testing", "network", "hacking", "offensive-security"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "packet"
path = "packet.rs"

[[bin]]
name = "flux"
path = "flux.rs"

[[bin]]
name = "fluxv5"
path = "fluxv5.rs"

[[bin]]
name = "fluxv9pro"
path = "fluxv9pro.rs"

[[bin]]
name = "forge"
path = "forge.rs"

[[bin]]
name = "frostbite"
path = "frostbite.rs"

[[bin]]
name = "ghosthand"
path = "ghosthand.rs"

[[bin]]
name = "ironwire"
path = "ironwire.rs"

[[bin]]
name = "ja3desync"
path = "ja3desync.rs"

[[bin]]
name = "overrun"
path = "overrun.rs"

[[bin]]
name = "pipex"
path = "pipex.rs"

[[bin]]
name = "preventddos"
path = "preventddos.rs"

[[bin]]
name = "refract"
path = "refract.rs"

[[bin]]
name = "resolver"
path = "resolver.rs"

[[bin]]
name = "riptide"
path = "riptide.rs"

[[bin]]
name = "timewarp"
path = "timewarp.rs"

[[bin]]
name = "tlsfracture"
path = "tlsfracture.rs"

[[bin]]
name = "voltage"
path = "voltage.rs"

[[bin]]
name = "wafdetect"
path = "wafdetect.rs"

[[bin]]
name = "echohammer"
path = "echohammer.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Async utilities
futures-util = "0.3"

# Networking and packet manipulation
pnet = "0.35"
url = "2.5"
urlencoding = "2.1"
hostname = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
sha2 = "0.10"
crc = "3.0"

# Error handling
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Command line interface
clap = { version = "4.0", features = ["derive"] }

# Random number generation
rand = "0.8"

# CPU count detection
num_cpus = "1.16"

# Colored terminal output
colored = "2.1"

# Performance optimizations
hashbrown = "0.14"

# System information
sysinfo = "0.30"

# System calls for privilege checking
libc = "0.2"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Advanced socket handling
socket2 = "0.5"

# HTTP client for web-based tools
reqwest = { version = "0.11", features = ["json", "stream"] }
http = "0.2"
tokio-tungstenite = "0.20"
h2 = "0.3"
tungstenite = "0.20"

# TLS/SSL handling
native-tls = "0.2"
rustls = "0.21"
openssl = "0.10"
tokio-openssl = "0.6"

# DNS resolution
trust-dns-resolver = "0.23"

# Compression
flate2 = "1.0"
xz2 = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Regular expressions
regex = "1.10"

# File system operations
walkdir = "2.4"
once_cell = "1.21.3"
base64 = "0.22.1"
indicatif = "0.18.4"
hyper = { version = "1.8.1", features = ["client", "http1", "http2"] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio-native-tls = "0.3.1"
bytes = "1.11.1"
hmac = "0.12.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 2
panic = "abort"
strip = false
overflow-checks = false

[profile.dev]
opt-level = 3
debug = true
